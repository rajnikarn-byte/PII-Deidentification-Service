name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test & build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x, 24.x]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage thresholds
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Smoke-test the compiled server
        shell: bash
        run: |
          set -euo pipefail
          PORT=3999 HOST=127.0.0.1 LOG_LEVEL=debug node dist/server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=false
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3999/health > /dev/null; then ready=true; break; fi
            sleep 0.5
          done
          if [ "$ready" != true ]; then echo "Server did not become healthy"; cat server.log; exit 1; fi

          body=$(curl -fsS -X POST http://127.0.0.1:3999/deidentify \
            -H 'Content-Type: application/json' \
            -d '{"text":"mail jane@example.com, SSN 123-45-6789"}')
          echo "$body"
          grep -q '"deidentifiedText":"mail \[EMAIL\], SSN \[SSN\]"' <<< "$body"

          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3999/deidentify \
            -H 'Content-Type: application/json' -d '{"text": "SSN 123-45-6789"')
          [ "$status" = 400 ]

          if grep -E 'jane@example\.com|123-45-6789' server.log; then
            echo "Submitted PII found in server logs"; exit 1
          fi

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
